[package]
name = "mql-lsp"
version = "0.1.1"
edition = "2021"
description = "Lightweight MQL5 language server (hover, completion, go-to-definition)"
license = "MIT"

[workspace]

[dependencies]
lsp-server = "0.7"
lsp-types = "0.94"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
