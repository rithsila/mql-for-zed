[package]
name = "mql-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
mcp-core = "0.1.50"
mcp-server = "0.1.0"
mcp-spec = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }
[workspace]
